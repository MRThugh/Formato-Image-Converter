name: Build Multi-Platform Executables & Installers

permissions:
  contents: write

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =======================================================
  # 0. PREPARE VERSIONING (DRY Step)
  # =======================================================
  prepare:
    name: Prepare Versioning
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
      file_version: ${{ steps.version.outputs.file_version }}
      is_tag: ${{ steps.version.outputs.is_tag }}
    steps:
      - name: Calculate Version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.ref_type }}" == "tag" && $TAG =~ ^v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            RAW_VER="${BASH_REMATCH[1]}"
            FILE_VER="v${RAW_VER}"
            IS_TAG="true"
          else
            RAW_VER="2.5.0"
            FILE_VER="dev-build-${{ github.run_number }}"
            IS_TAG="false"
          fi
          echo "app_version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "file_version=${FILE_VER}" >> $GITHUB_OUTPUT
          echo "is_tag=${IS_TAG}" >> $GITHUB_OUTPUT


  # =======================================================
  # 1. WINDOWS BUILD (PyInstaller + Inno Setup)
  # =======================================================
  build-windows:
    name: Build Windows (.exe Setup)
    needs: prepare
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --icon="assets/icon.ico" `
            --add-data "assets;assets" `
            --name "Formato" `
            main.py

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Generate Inno Setup Script
        shell: pwsh
        run: |
          $APP_VER = "${{ needs.prepare.outputs.app_version }}"
          $FILE_VER = "${{ needs.prepare.outputs.file_version }}"
          
          @"
          [Setup]
          AppName=Formato - Professional Image Studio
          AppVersion=$APP_VER
          AppPublisher=Ali Kamrani
          DefaultDirName={autopf}\Formato
          DefaultGroupName=Formato
          UninstallDisplayIcon={app}\Formato.exe
          Compression=lzma2/ultra
          SolidCompression=yes
          OutputDir=installer_output
          OutputBaseFilename=Formato-$FILE_VER-Windows-Setup
          SetupIconFile=assets\icon.ico

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Files]
          Source: "dist\Formato\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autoprograms}\Formato"; Filename: "{app}\Formato.exe"
          Name: "{autodesktop}\Formato"; Filename: "{app}\Formato.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\Formato.exe"; Description: "{cm:LaunchProgram,Formato}"; Flags: nowait postinstall skipifsilent
          "@ | Out-File -FilePath installer.iss -Encoding utf8

      - name: Compile Setup Installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formato-Windows-Setup
          path: installer_output/Formato-${{ needs.prepare.outputs.file_version }}-Windows-Setup.exe


  # =======================================================
  # 2. MACOS BUILD (PyInstaller + DMG)
  # =======================================================
  build-macos:
    name: Build macOS (.dmg)
    needs: prepare
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS App Bundle
        run: |
          pyinstaller --noconfirm --windowed \
            --icon="assets/icon.ico" \
            --add-data "assets:assets" \
            --name "Formato" \
            main.py

      - name: Create DMG File
        run: |
          hdiutil create -volname "Formato" -srcfolder "dist/Formato.app" -ov -format UDZO "dist/Formato-${{ needs.prepare.outputs.file_version }}-macOS.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formato-macOS
          path: dist/Formato-${{ needs.prepare.outputs.file_version }}-macOS.dmg


  # =======================================================
  # 3. LINUX BUILD (PyInstaller + Tar.gz Archive)
  # =======================================================
  build-linux:
    name: Build Linux (.tar.gz)
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install System Dependencies for PySide6/Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --icon="assets/icon.ico" \
            --add-data "assets:assets" \
            --name "Formato" \
            main.py

      - name: Compress Linux Output with Version
        run: |
          cd dist
          tar -czvf "Formato-${{ needs.prepare.outputs.file_version }}-Linux-x64.tar.gz" Formato

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formato-Linux
          path: dist/Formato-${{ needs.prepare.outputs.file_version }}-Linux-x64.tar.gz


  # =======================================================
  # 4. AUTOMATIC GITHUB RELEASE (Only Runs on Tag Push)
  # =======================================================
  release:
    name: Publish Github Release
    needs: [prepare, build-windows, build-macos, build-linux]
    if: needs.prepare.outputs.is_tag == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: Formato-Windows-Setup
          path: ./release-files

      - name: Download macOS DMG
        uses: actions/download-artifact@v4
        with:
          name: Formato-macOS
          path: ./release-files

      - name: Download Linux Archive
        uses: actions/download-artifact@v4
        with:
          name: Formato-Linux
          path: ./release-files

      - name: Create Release and Upload Versioned Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Formato ${{ github.ref_name }}
          files: ./release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
