name: Build Formato

on:
  workflow_dispatch:

  release:
    types: [published]

jobs:

  windows:
    runs-on: windows-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller ^
          --onefile ^
          --windowed ^
          --name Formato ^
          main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formato-Windows
          path: dist/Formato.exe

  linux:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Binary
        run: |
          pyinstaller \
          --onefile \
          --windowed \
          --name Formato \
          main.py

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Formato-Linux
          path: dist/Formato
